apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: amr-caas-registry
      nodeSelector:
        kubernetes.io/hostname: sc09dell05-g3
      containers:
        - name: modelserver
          image: amr-registry.caas.intel.com/taas/llm-d/gaudi_rhel9.6_dockerfile.rhel.hpu:75-18453e3
          command: ["vllm", "serve"]
          # CI-sized default for Gaudi. HPU typically runs with block-size=128;
          # precise prefix cache scoring requires scorer.tokenProcessorConfig.blockSize
          # to match whatever vLLM is configured with. Update both sides together
          # if you change --block-size here, and update `modelName` in
          # scheduler/precise-prefix-cache-aware.values.yaml to Qwen/Qwen3-8B.
          args:
            - "Qwen/Qwen3-32B"
            - "--block-size=128"
            - "--no-enable-prefix-caching"
            - "--tensor-parallel-size=2"
            - "--max-model-len=91964"
            - "--gpu-memory-utilization=0.65"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@Qwen/Qwen3-32B"}'
            #- "--kv-transfer-config"
            #- '{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":107374182400,"block_size":128,"eviction_policy":"lru"}}'
            # Uncomment for distributed tracing
            # - "--otlp-traces-endpoint=http://otel-collector:4317"
            # - "--collect-detailed-traces=all"
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_PORT
              value: "8000"
            - name: KV_EVENTS_ENDPOINT
              value: "tcp://precise-prefix-cache-aware-epp.$(NAMESPACE).svc.cluster.local:5556"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: OMPI_MCA_btl_vader_single_copy_mechanism
              value: "none"
            - name: HABANA_LOGS
              value: "/tmp/habana_logs"
            - name: VLLM_SKIP_WARMUP
              value: "true"
            - name: DO_NOT_TRACK
              value: "1"
            - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
              value: "1"
            - name: HTTP_PROXY
              value: "http://proxy-dmz.intel.com:911"
            - name: HTTPS_PROXY
              value: "http://proxy-dmz.intel.com:911"
            - name: NO_PROXY
              value: ".cluster.local,10.0.0.0/8,192.169.0.0/16,localhost,127.0.0.1"
            - name: http_proxy
              value: "http://proxy-dmz.intel.com:911"
            - name: https_proxy
              value: "http://proxy-dmz.intel.com:911"
            - name: no_proxy
              value: ".cluster.local,10.0.0.0/8,192.169.0.0/16,localhost,127.0.0.1"
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface/hub
          resources:
            claims:
              - name: precise-prefix-cache-aware-gaudi-claim
          
          volumeMounts:
            # Triton/Inductor caches at /.triton, not writable under
            # restricted SecurityContexts (e.g. OpenShift).
            - mountPath: /.triton
              name: triton-cache
            - name: pytorch-models
              mountPath: /models
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      resourceClaims:
        - name: precise-prefix-cache-aware-gaudi-claim
          resourceClaimTemplateName: precise-prefix-cache-aware-gaudi-claim
      volumes:
        - name: triton-cache
          emptyDir: {}
        - name: pytorch-models
          hostPath:
            path: /software/data/pytorch
            type: Directory
